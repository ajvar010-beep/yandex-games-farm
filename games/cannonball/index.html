<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="«Ядро» — баллистика на закатном полигоне: задай угол и силу, пусти ядро по дуге с рикошетами и разбей все мишени за отведённые выстрелы.">
<title>Ядро</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #1a1024;
    position: fixed; inset: 0;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: none; overscroll-behavior: none;
  }
  #game { display: block; width: 100%; height: 100%; touch-action: none; }
  /* Boot-оверлей: ядро и пунктирная дуга к мишени, без единой буквы. */
  #boot {
    position: fixed; inset: 0; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    background: #1a1024;
  }
  #bootmark {
    width: 150px; height: 96px;
    position: relative;
    animation: bootpulse 1.4s ease-in-out infinite;
  }
  #bootmark::before { /* пунктирная дуга */
    content: ''; position: absolute; left: 6px; top: 4px;
    width: 96px; height: 62px;
    border: 3px dashed rgba(255, 213, 138, 0.55);
    border-color: rgba(255, 213, 138, 0.55) transparent transparent transparent;
    border-radius: 50% 50% 0 0 / 90% 90% 0 0;
    transform: rotate(-8deg);
  }
  #bootmark::after { /* само ядро */
    content: ''; position: absolute; left: 58px; top: 36px;
    width: 34px; height: 34px; border-radius: 50%;
    background: radial-gradient(circle at 34% 30%, #b3bdc9 0%, #4c5661 45%, #23272e 100%);
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.55);
  }
  #boottarget {
    position: absolute; right: 0; top: 0;
    width: 46px; height: 46px; border-radius: 50%;
    background: radial-gradient(circle, #3a2320 0 12%, #d64a3c 12% 34%, #f4e7cb 34% 56%, #d64a3c 56% 78%, #f4e7cb 78% 100%);
    box-shadow: 0 0 0 4px #3b434e;
  }
  @keyframes bootpulse {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50%      { transform: translateY(-5px) rotate(2deg); }
  }
</style>
</head>
<body>
<div id="boot"><div id="bootmark"><div id="boottarget"></div></div></div>
<canvas id="game"></canvas>
<script>
  (function () {
    var p = location.protocol;
    if (p !== 'file:' && p !== 'about:' && p !== 'data:') {
      document.write('<script src="/sdk.js"><\/script>');
    }
  })();
</script>
<script src="sdk-stub.js"></script>
<script src="engine/rng.js"></script>
<script src="engine/i18n.js"></script>
<script src="engine/audio.js"></script>
<script src="engine/input.js"></script>
<script src="engine/ui.js"></script>
<script src="engine/fx.js"></script>
<script src="engine/storage.js"></script>
<script src="engine/sdk.js"></script>
<script src="engine/core.js"></script>
<script src="engine/capture.js"></script>
<script src="game/config.js"></script>
<script src="game/i18n.js"></script>
<script src="game/logic.js"></script>
<script src="game/art.js"></script>
<script src="game/scenes.js"></script>
<script src="game/main.js"></script>
</body>
</html>
