<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Латунный Порядок — пятнашки из старой мастерской: двенадцать латунных досок, гравированные плитки, подсказки и магазин.">
<title>Латунный Порядок</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #241810;
    position: fixed; inset: 0;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: none; overscroll-behavior: none;
  }
  #game { display: block; width: 100%; height: 100%; touch-action: none; }
  /* Boot-оверлей: латунная доска 2×2 с пустой клеткой, без текста. */
  #boot {
    position: fixed; inset: 0; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    background: #241810;
  }
  #bootmark {
    width: 104px; height: 104px; border-radius: 12px;
    box-sizing: border-box; padding: 9px;
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
    gap: 5px;
    background: linear-gradient(145deg, #f2dda0 0%, #c9a24a 34%, #a8863a 68%, #70571c 100%);
    box-shadow: 0 14px 30px rgba(0,0,0,0.55), inset 0 0 0 2px rgba(70,50,12,0.5);
    animation: bootpulse 1.3s ease-in-out infinite;
  }
  #bootmark i {
    border-radius: 5px;
    background: linear-gradient(160deg, #fdf6e2, #f3e7c9 55%, #e2d0a8);
    box-shadow: inset 0 0 0 1px rgba(120,92,40,0.35);
  }
  #bootmark i.hole {
    background: linear-gradient(160deg, #191008, #3a2718);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.6);
  }
  @keyframes bootpulse {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50%      { transform: translateY(-4px) rotate(1deg); }
  }
</style>
</head>
<body>
<div id="boot"><div id="bootmark"><i></i><i></i><i></i><i class="hole"></i></div></div>
<canvas id="game"></canvas>
<script>
  (function () {
    var p = location.protocol;
    if (p !== 'file:' && p !== 'about:' && p !== 'data:') {
      document.write('<script src="/sdk.js"><\/script>');
    }
  })();
</script>
<script src="sdk-stub.js"></script>
<script src="engine/rng.js"></script>
<script src="engine/i18n.js"></script>
<script src="engine/audio.js"></script>
<script src="engine/input.js"></script>
<script src="engine/ui.js"></script>
<script src="engine/fx.js"></script>
<script src="engine/storage.js"></script>
<script src="engine/sdk.js"></script>
<script src="engine/core.js"></script>
<script src="engine/capture.js"></script>
<script src="game/config.js"></script>
<script src="game/i18n.js"></script>
<script src="game/logic.js"></script>
<script src="game/art.js"></script>
<script src="game/scenes.js"></script>
<script src="game/main.js"></script>
</body>
</html>
