<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Ламповый Сад — аркада: ловите горящих светлячков и берегитесь гусениц">
<title>Ламповый Сад</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #0e1428;
    position: fixed; inset: 0;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: none; overscroll-behavior: none;
  }
  #game { display: block; width: 100%; height: 100%; touch-action: none; }
  /* Boot-оверлей БЕЗ ТЕКСТА: первая строка, которую видит игрок, обязана быть из
     i18n-словаря и совпадать с материалами (5.1.3). Splash — светящийся
     светлячок (бренд-знак без glyphs). */
  #boot {
    position: fixed; inset: 0; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    background: #0e1428;
  }
  #bootmark {
    width: 42px; height: 58px; border-radius: 50% 50% 46% 46% / 58% 58% 42% 42%;
    background: radial-gradient(circle at 50% 72%, #fffbe0 0%, #ffe873 38%, #8a6d3b 78%);
    box-shadow: 0 0 26px 8px rgba(255,232,115,0.55), 0 0 70px 26px rgba(255,232,115,0.22);
    position: relative;
    animation: bootpulse 1.3s ease-in-out infinite;
  }
  /* крылышки */
  #bootmark::before, #bootmark::after {
    content: ''; position: absolute; top: -6px;
    width: 16px; height: 34px; border-radius: 50%;
    background: rgba(207,232,255,0.5);
  }
  #bootmark::before { left: -12px; transform: rotate(-30deg); }
  #bootmark::after  { right: -12px; transform: rotate(30deg); }
  @keyframes bootpulse {
    0%, 100% { transform: scale(1); filter: brightness(0.85); }
    50%      { transform: scale(1.08); filter: brightness(1.25); }
  }
</style>
</head>
<body>
<div id="boot"><div id="bootmark"></div></div>
<canvas id="game"></canvas>
<!-- 1.1: SDK подключается официальным <script src="/sdk.js"> на платформе;
     на file:// тег НЕ вставляется (нет 404-ошибки в консоли), работает заглушка. -->
<script>
  (function () {
    var p = location.protocol;
    if (p !== 'file:' && p !== 'about:' && p !== 'data:') {
      document.write('<script src="/sdk.js"><\/script>');
    }
  })();
</script>
<script src="sdk-stub.js"></script>
<script src="engine/rng.js"></script>
<script src="engine/i18n.js"></script>
<script src="engine/audio.js"></script>
<script src="engine/input.js"></script>
<script src="engine/ui.js"></script>
<script src="engine/fx.js"></script>
<script src="engine/storage.js"></script>
<script src="engine/sdk.js"></script>
<script src="engine/core.js"></script>
<script src="engine/capture.js"></script>
<script src="game/config.js"></script>
<script src="game/i18n.js"></script>
<script src="game/art.js"></script>
<script src="game/entities.js"></script>
<script src="game/scenes.js"></script>
<script src="game/main.js"></script>
</body>
</html>
