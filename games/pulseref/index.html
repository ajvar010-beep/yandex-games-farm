<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="«Пульс» — неоновая ритм-аркада: четыре дорожки, ноты в такт, комбо, фантомы и 12 песен.">
<title>Пульс</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #07040f;
    position: fixed; inset: 0;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: none; overscroll-behavior: none;
  }
  #game { display: block; width: 100%; height: 100%; touch-action: none; }
  /* Boot-оверлей: четыре неоновых дорожки на бит, без текста. */
  #boot {
    position: fixed; inset: 0; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(120% 90% at 50% 40%, #2a0a3e 0%, #12061f 55%, #07040f 100%);
  }
  #bootwrap {
    display: flex; align-items: flex-end; gap: 9px; height: 92px;
    animation: bootbeat 1s ease-in-out infinite;
  }
  .bbar {
    display: block; width: 15px; border-radius: 8px;
    background: linear-gradient(180deg, #22e8ff 0%, #8a5cff 55%, #ff2d95 100%);
    box-shadow: 0 0 16px rgba(34,232,255,0.75), 0 0 28px rgba(255,45,149,0.35);
  }
  .bbar:nth-child(1) { height: 38px; }
  .bbar:nth-child(2) { height: 74px; }
  .bbar:nth-child(3) { height: 56px; }
  .bbar:nth-child(4) { height: 88px; }
  @keyframes bootbeat {
    0%, 100% { transform: scaleY(0.9) translateY(2px); opacity: 0.85; }
    50%      { transform: scaleY(1.06) translateY(-2px); opacity: 1; }
  }
</style>
</head>
<body>
<div id="boot"><div id="bootwrap"><i class="bbar"></i><i class="bbar"></i><i class="bbar"></i><i class="bbar"></i></div></div>
<canvas id="game"></canvas>
<script>
  (function () {
    var p = location.protocol;
    if (p !== 'file:' && p !== 'about:' && p !== 'data:') {
      document.write('<script src="/sdk.js"><\/script>');
    }
  })();
</script>
<script src="sdk-stub.js"></script>
<script src="engine/rng.js"></script>
<script src="engine/i18n.js"></script>
<script src="engine/audio.js"></script>
<script src="engine/input.js"></script>
<script src="engine/ui.js"></script>
<script src="engine/fx.js"></script>
<script src="engine/storage.js"></script>
<script src="engine/sdk.js"></script>
<script src="engine/core.js"></script>
<script src="engine/capture.js"></script>
<script src="game/config.js"></script>
<script src="game/i18n.js"></script>
<script src="game/logic.js"></script>
<script src="game/art.js"></script>
<script src="game/scenes.js"></script>
<script src="game/main.js"></script>
</body>
</html>
