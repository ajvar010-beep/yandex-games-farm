<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="«Пиксель-Код» — неоновая нонограмма: читай цифры, закрашивай клетки и собирай пиксельные образы. 12 схем, три ошибки на попытку.">
<title>Пиксель-Код</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #0a0614;
    position: fixed; inset: 0;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: none; overscroll-behavior: none;
  }
  #game { display: block; width: 100%; height: 100%; touch-action: none; }
  /* Boot-оверлей: неоновая мозаика из девяти клеток, без текста. */
  #boot {
    position: fixed; inset: 0; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 42%, #1c0b3a 0%, #0a0614 62%);
  }
  #bootmark {
    width: 96px; height: 96px; position: relative;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
    animation: bootpulse 1.3s ease-in-out infinite;
    filter: drop-shadow(0 0 14px rgba(34,211,238,0.55));
  }
  #bootmark i { border-radius: 3px; background: linear-gradient(140deg, #a855f7, #22d3ee); }
  #bootmark i:nth-child(2), #bootmark i:nth-child(4), #bootmark i:nth-child(8) { background: rgba(168,85,247,0.18); }
  @keyframes bootpulse {
    0%, 100% { transform: scale(1); opacity: 0.86; }
    50%      { transform: scale(1.06); opacity: 1; }
  }
</style>
</head>
<body>
<div id="boot"><div id="bootmark"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
<canvas id="game"></canvas>
<script>
  (function () {
    var p = location.protocol;
    if (p !== 'file:' && p !== 'about:' && p !== 'data:') {
      document.write('<script src="/sdk.js"><\/script>');
    }
  })();
</script>
<script src="sdk-stub.js"></script>
<script src="engine/rng.js"></script>
<script src="engine/i18n.js"></script>
<script src="engine/audio.js"></script>
<script src="engine/input.js"></script>
<script src="engine/ui.js"></script>
<script src="engine/fx.js"></script>
<script src="engine/storage.js"></script>
<script src="engine/sdk.js"></script>
<script src="engine/core.js"></script>
<script src="engine/capture.js"></script>
<script src="game/config.js"></script>
<script src="game/i18n.js"></script>
<script src="game/logic.js"></script>
<script src="game/art.js"></script>
<script src="game/scenes.js"></script>
<script src="game/main.js"></script>
</body>
</html>
