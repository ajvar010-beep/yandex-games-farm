<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Козырь — дурак подкидной против двенадцати соперников трактира: свои манеры игры, монеты и магазин перков.">
<title>Козырь</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #0e1a16;
    position: fixed; inset: 0;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: none; overscroll-behavior: none;
  }
  #game { display: block; width: 100%; height: 100%; touch-action: none; }
  /* Boot-оверлей: карта с козырем, без текста. */
  #boot {
    position: fixed; inset: 0; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    background: #0e1a16;
  }
  #bootmark {
    width: 74px; height: 106px; border-radius: 10px;
    background: linear-gradient(160deg, #fbf7ee 0%, #efe6d2 100%);
    box-shadow: 0 10px 24px rgba(0,0,0,0.45), inset 0 0 0 3px #f2c14e;
    position: relative;
    animation: bootpulse 1.1s ease-in-out infinite;
  }
  #bootmark::before { /* ромб-козырь */
    content: ''; position: absolute; left: 50%; top: 50%;
    width: 34px; height: 34px; margin: -17px 0 0 -17px;
    background: #c0392b;
    transform: rotate(45deg);
    border-radius: 3px;
  }
  @keyframes bootpulse {
    0%, 100% { transform: scale(1) rotate(-3deg); }
    50%      { transform: scale(1.06, 0.96) rotate(3deg); }
  }
</style>
</head>
<body>
<div id="boot"><div id="bootmark"></div></div>
<canvas id="game"></canvas>
<script src="engine/platform.js"></script>
<script src="sdk-stub.js"></script>
<script src="engine/platform/vk.js"></script>
<script src="engine/platform/gamemonetize.js"></script>
<script src="engine/rng.js"></script>
<script src="engine/i18n.js"></script>
<script src="engine/audio.js"></script>
<script src="engine/input.js"></script>
<script src="engine/ui.js"></script>
<script src="engine/fx.js"></script>
<script src="engine/storage.js"></script>
<script src="engine/sdk.js"></script>
<script src="engine/core.js"></script>
<script src="engine/capture.js"></script>
<script src="game/config.js"></script>
<script src="game/i18n.js"></script>
<script src="game/logic.js"></script>
<script src="game/art.js"></script>
<script src="game/scenes.js"></script>
<script src="game/main.js"></script>
</body>
</html>
