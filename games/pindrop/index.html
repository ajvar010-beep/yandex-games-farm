<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="«Гвозди» — выдёргивай шпильки, направляй стальные шары в три чаши и заполняй их все. 15 уровней мастерской, магазин и рекорд.">
<title>Гвозди</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #14100c;
    position: fixed; inset: 0;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: none; overscroll-behavior: none;
  }
  #game { display: block; width: 100%; height: 100%; touch-action: none; }
  /* Boot-оверлей: шпилька со шляпкой и шар — без текста. */
  #boot {
    position: fixed; inset: 0; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    background: #14100c;
  }
  #bootmark {
    width: 128px; height: 128px; position: relative;
    animation: bootpulse 1.3s ease-in-out infinite;
  }
  #bootmark::before { /* шпилька */
    content: ''; position: absolute; left: 22px; top: 26px;
    width: 12px; height: 74px; border-radius: 6px;
    transform: rotate(18deg);
    background: linear-gradient(90deg, #3c4552 0%, #c2cfdd 42%, #7f8c9c 66%, #2a313a 100%);
    box-shadow: 0 6px 16px rgba(0,0,0,0.6);
  }
  #bootmark::after { /* янтарная шляпка */
    content: ''; position: absolute; left: 12px; top: 16px;
    width: 30px; height: 30px; border-radius: 50%;
    background: radial-gradient(circle at 34% 30%, #ffd47a 0%, #f0a52b 55%, #8a5410 100%);
    box-shadow: 0 0 18px rgba(240,165,43,0.55);
  }
  #bootball {
    position: absolute; right: 14px; bottom: 18px;
    width: 34px; height: 34px; border-radius: 50%;
    background: radial-gradient(circle at 33% 30%, #f2f7fc 0%, #c3d0de 30%, #7d8b9c 64%, #333b46 100%);
    box-shadow: 0 6px 14px rgba(0,0,0,0.55), inset 0 -3px 6px rgba(0,0,0,0.35);
  }
  @keyframes bootpulse {
    0%, 100% { transform: translateY(0) rotate(-1.5deg); }
    50%      { transform: translateY(-5px) rotate(1.5deg); }
  }
</style>
</head>
<body>
<div id="boot"><div id="bootmark"><div id="bootball"></div></div></div>
<canvas id="game"></canvas>
<script>
  (function () {
    var p = location.protocol;
    if (p !== 'file:' && p !== 'about:' && p !== 'data:') {
      document.write('<script src="/sdk.js"><\/script>');
    }
  })();
</script>
<script src="sdk-stub.js"></script>
<script src="engine/rng.js"></script>
<script src="engine/i18n.js"></script>
<script src="engine/audio.js"></script>
<script src="engine/input.js"></script>
<script src="engine/ui.js"></script>
<script src="engine/fx.js"></script>
<script src="engine/storage.js"></script>
<script src="engine/sdk.js"></script>
<script src="engine/core.js"></script>
<script src="engine/capture.js"></script>
<script src="game/config.js"></script>
<script src="game/i18n.js"></script>
<script src="game/logic.js"></script>
<script src="game/art.js"></script>
<script src="game/scenes.js"></script>
<script src="game/main.js"></script>
</body>
</html>
