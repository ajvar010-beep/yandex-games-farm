<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="«Сердце Лабиринта» — веди светящийся шар по мшистым катакомбам, собери три ключа, не попадись дозорным и открой дверь сердца.">
<title>Сердце Лабиринта</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #0a100d;
    position: fixed; inset: 0;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: none; overscroll-behavior: none;
  }
  #game { display: block; width: 100%; height: 100%; touch-action: none; }
  /* Boot-оверлей: каменное кольцо и светящееся сердце, без текста. */
  #boot {
    position: fixed; inset: 0; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 46%, #17261f 0%, #0b1310 55%, #060a08 100%);
  }
  #bootmark {
    width: 96px; height: 96px; border-radius: 50%;
    border: 13px solid #3c5146;
    background: radial-gradient(circle at 46% 42%, #ffffff 0%, #8fe8ff 38%, #2f9fc4 70%, #1b5d74 100%);
    box-shadow: 0 0 34px rgba(143,232,255,0.55), inset 0 0 18px rgba(255,255,255,0.55);
    position: relative;
    animation: bootpulse 1.4s ease-in-out infinite;
  }
  #bootmark::after {
    content: ''; position: absolute; left: 50%; top: 50%;
    width: 132px; height: 26px; transform: translate(-50%, -50%) rotate(24deg);
    border-radius: 12px; background: #0b1310;
  }
  @keyframes bootpulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.06); }
  }
</style>
</head>
<body>
<div id="boot"><div id="bootmark"></div></div>
<canvas id="game"></canvas>
<script>
  (function () {
    var p = location.protocol;
    if (p !== 'file:' && p !== 'about:' && p !== 'data:') {
      document.write('<script src="/sdk.js"><\/script>');
    }
  })();
</script>
<script src="sdk-stub.js"></script>
<script src="engine/rng.js"></script>
<script src="engine/i18n.js"></script>
<script src="engine/audio.js"></script>
<script src="engine/input.js"></script>
<script src="engine/ui.js"></script>
<script src="engine/fx.js"></script>
<script src="engine/storage.js"></script>
<script src="engine/sdk.js"></script>
<script src="engine/core.js"></script>
<script src="engine/capture.js"></script>
<script src="game/config.js"></script>
<script src="game/i18n.js"></script>
<script src="game/logic.js"></script>
<script src="game/art.js"></script>
<script src="game/scenes.js"></script>
<script src="game/main.js"></script>
</body>
</html>
