<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Hexwave — neon core-defense arcade">
<title>Hexwave</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #0b0e1a;
    position: fixed; inset: 0;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: none; overscroll-behavior: none;
  }
  #game { display: block; width: 100%; height: 100%; touch-action: none; }
  /* Boot-оверлей — БЕЗ ТЕКСТА: первая строка, которую видит игрок, обязана быть
     из i18n-словаря и совпадать с названием в материалах (5.1.3), а RU-название —
     «Гексоволна». Поэтому splash — чисто графическая пульсирующая гекс-метка
     (бренд-знак без glyphs), одинаковая для всех языков. */
  #boot {
    position: fixed; inset: 0; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    background: #0b0e1a;
  }
  #bootmark {
    width: 54px; height: 60px;
    background: #7df9ff;
    clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
    animation: bootpulse 1.1s ease-in-out infinite;
  }
  @keyframes bootpulse {
    0%, 100% { transform: scale(1); opacity: 0.75; }
    50%      { transform: scale(1.14); opacity: 1; }
  }
</style>
</head>
<body>
<div id="boot"><div id="bootmark"></div></div>
<canvas id="game"></canvas>
<!-- Требование 1.1: официальный SDK Яндекс Игр подключается тегом <script src="/sdk.js">.
     НО: статический тег на file:// даёт net::ERR_FILE_NOT_FOUND уровня ERROR, что ломает
     жёсткое требование «ноль ошибок в консоли» (6.4) при локальном запуске из zip —
     а локальный запуск из распакованного zip прямо требуется задачей. Поэтому тег
     вставляется синхронным document.write на ЛЮБОМ протоколе, кроме локальных
     (file:/about:/data:) — т.е. на платформе (http/https и любой иной схеме хостинга)
     SDK подключается ровно официальным способом, и document.write во время парсинга
     сохраняет порядок загрузки: SDK исполняется ДО sdk-stub.js и движка, побайтово
     эквивалентно статическому тегу. На file:// запроса нет вообще — ноль ошибок,
     сразу работает заглушка. -->
<script>
  (function () {
    var p = location.protocol;
    if (p !== 'file:' && p !== 'about:' && p !== 'data:') {
      document.write('<script src="/sdk.js"><\/script>');
    }
  })();
</script>
<script src="sdk-stub.js"></script>
<script src="engine/rng.js"></script>
<script src="engine/i18n.js"></script>
<script src="engine/audio.js"></script>
<script src="engine/input.js"></script>
<script src="engine/ui.js"></script>
<script src="engine/fx.js"></script>
<script src="engine/storage.js"></script>
<script src="engine/sdk.js"></script>
<script src="engine/core.js"></script>
<script src="engine/capture.js"></script>
<script src="game/config.js"></script>
<script src="game/i18n.js"></script>
<script src="game/entities.js"></script>
<script src="game/scenes.js"></script>
<script src="game/main.js"></script>
</body>
</html>
