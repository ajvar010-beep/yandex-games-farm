<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Побег с Парковки — головоломка: освободи стоянку, развози машины колоннами и уложись в минимум ходов.">
<title>Побег с Парковки</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #23282f;
    position: fixed; inset: 0;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: none; overscroll-behavior: none;
  }
  #game { display: block; width: 100%; height: 100%; touch-action: none; }
  /* Boot-оверлей без текста — плитка со стрелкой (бренд-знак без glyphs). */
  #boot {
    position: fixed; inset: 0; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    background: #23282f;
  }
  #bootmark {
    width: 58px; height: 86px; border-radius: 18px;
    background: linear-gradient(160deg, #ff8787 0%, #e03131 55%, #a61e1e 100%);
    box-shadow: 0 8px 0 rgba(0,0,0,0.30), inset 0 -8px 14px rgba(0,0,0,0.20);
    position: relative;
    animation: bootpulse 1.1s ease-in-out infinite;
  }
  #bootmark::before { /* лобовое стекло */
    content: ''; position: absolute; left: 11px; right: 11px; top: 20px; height: 24px;
    border-radius: 7px;
    background: linear-gradient(180deg, rgba(225,244,255,0.9), rgba(35,64,88,0.95));
    transform: skewX(-7deg);
  }
  #bootmark::after { /* фары */
    content: ''; position: absolute; left: 9px; top: 5px;
    width: 11px; height: 6px; border-radius: 3px; background: #fff9db;
    box-shadow: 29px 0 0 #fff9db;
  }
  @keyframes bootpulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.08, 0.94); }
  }
</style>
</head>
<body>
<div id="boot"><div id="bootmark"></div></div>
<canvas id="game"></canvas>
<script src="engine/platform.js"></script>
<script src="sdk-stub.js"></script>
<script src="engine/platform/vk.js"></script>
<script src="engine/platform/gamemonetize.js"></script>
<script src="engine/rng.js"></script>
<script src="engine/i18n.js"></script>
<script src="engine/audio.js"></script>
<script src="engine/input.js"></script>
<script src="engine/ui.js"></script>
<script src="engine/fx.js"></script>
<script src="engine/storage.js"></script>
<script src="engine/sdk.js"></script>
<script src="engine/core.js"></script>
<script src="engine/capture.js"></script>
<script src="game/config.js"></script>
<script src="game/i18n.js"></script>
<script src="game/logic.js"></script>
<script src="game/art.js"></script>
<script src="game/scenes.js"></script>
<script src="game/main.js"></script>
</body>
</html>
