<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Слово-Сетка — найди все спрятанные слова на сетке букв">
<title>Слово-Сетка</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #f4ead4;
    position: fixed; inset: 0;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: none; overscroll-behavior: none;
  }
  #game { display: block; width: 100%; height: 100%; touch-action: none; }
  /* Boot-оверлей БЕЗ ТЕКСТА: первая строка игрока — из i18n. Знак — лист с сеткой. */
  #boot {
    position: fixed; inset: 0; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    background: #f4ead4;
  }
  #bootmark {
    width: 64px; height: 64px; position: relative;
    border-radius: 10px;
    background: #fbf5e6;
    border: 3px solid #b8a684;
    box-shadow: 0 6px 18px rgba(88,66,38,0.25);
    animation: bootpulse 1.3s ease-in-out infinite;
  }
  #bootmark::before {
    content: ''; position: absolute; inset: 14px;
    background-image:
      linear-gradient(#b8a684 2px, transparent 2px),
      linear-gradient(90deg, #b8a684 2px, transparent 2px);
    background-size: 18px 18px, 18px 18px;
    opacity: 0.85;
  }
  #bootmark::after {
    content: ''; position: absolute;
    left: 16px; top: 16px; width: 16px; height: 16px;
    border-radius: 4px; background: #b4492f;
  }
  @keyframes bootpulse {
    0%, 100% { transform: scale(1) rotate(-2deg); }
    50%      { transform: scale(1.06) rotate(1deg); }
  }
</style>
</head>
<body>
<div id="boot"><div id="bootmark"></div></div>
<canvas id="game"></canvas>
<!-- SDK подключается официальным <script src="/sdk.js"> на платформе;
     на file:// тег НЕ вставляется (нет 404-ошибки в консоли), работает заглушка. -->
<script>
  (function () {
    var p = location.protocol;
    if (p !== 'file:' && p !== 'about:' && p !== 'data:') {
      document.write('<script src="/sdk.js"><\/script>');
    }
  })();
</script>
<script src="sdk-stub.js"></script>
<script src="engine/rng.js"></script>
<script src="engine/i18n.js"></script>
<script src="engine/audio.js"></script>
<script src="engine/input.js"></script>
<script src="engine/ui.js"></script>
<script src="engine/fx.js"></script>
<script src="engine/storage.js"></script>
<script src="engine/sdk.js"></script>
<script src="engine/core.js"></script>
<script src="engine/capture.js"></script>
<script src="game/config.js"></script>
<script src="game/i18n.js"></script>
<script src="game/logic.js"></script>
<script src="game/art.js"></script>
<script src="game/scenes.js"></script>
<script src="game/main.js"></script>
</body>
</html>
