<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="«Трубы» — поворотная головоломка о паровом водопроводе: вращай медные трубы, соедини кран со стоком и проведи воду через 15 уровней.">
<title>Трубы</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #07161a;
    position: fixed; inset: 0;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: none; overscroll-behavior: none;
  }
  #game { display: block; width: 100%; height: 100%; touch-action: none; }
  /* Boot-оверлей: медный угловой патрубок с вентилем, без текста. */
  #boot {
    position: fixed; inset: 0; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 45%, #0d2a2e 0%, #07161a 62%);
  }
  #bootmark {
    width: 92px; height: 92px; border-radius: 18px;
    background: linear-gradient(150deg, #e8a86a 0%, #b87333 42%, #5b2f14 100%);
    box-shadow: 0 14px 34px rgba(0,0,0,0.55), inset 0 0 0 3px #3a1d0c;
    position: relative;
    animation: bootpulse 1.3s ease-in-out infinite;
  }
  #bootmark::before { /* поворот трубы */
    content: ''; position: absolute; left: 12px; top: 12px;
    width: 44px; height: 44px; border-radius: 22px 6px 6px 6px;
    border: 13px solid #2a1508; border-right-color: transparent; border-bottom-color: transparent;
    box-sizing: border-box;
  }
  #bootmark::after { /* вода */
    content: ''; position: absolute; left: 26px; top: 26px;
    width: 22px; height: 22px; border-radius: 50%;
    background: radial-gradient(circle, #c8fff7 0%, #46e0d0 45%, rgba(70,224,208,0) 72%);
  }
  @keyframes bootpulse {
    0%, 100% { transform: rotate(-4deg) scale(1); }
    50%      { transform: rotate(4deg) scale(1.04); }
  }
</style>
</head>
<body>
<div id="boot"><div id="bootmark"></div></div>
<canvas id="game"></canvas>
<script src="engine/platform.js"></script>
<script src="sdk-stub.js"></script>
<script src="engine/platform/vk.js"></script>
<script src="engine/platform/gamemonetize.js"></script>
<script src="engine/rng.js"></script>
<script src="engine/i18n.js"></script>
<script src="engine/audio.js"></script>
<script src="engine/input.js"></script>
<script src="engine/ui.js"></script>
<script src="engine/fx.js"></script>
<script src="engine/storage.js"></script>
<script src="engine/sdk.js"></script>
<script src="engine/core.js"></script>
<script src="engine/capture.js"></script>
<script src="game/config.js"></script>
<script src="game/i18n.js"></script>
<script src="game/logic.js"></script>
<script src="game/art.js"></script>
<script src="game/scenes.js"></script>
<script src="game/main.js"></script>
</body>
</html>
