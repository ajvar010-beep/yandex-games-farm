<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="«Крепость на Колёсах» — собирай едущую крепость из блоков и оружия, отбивай волны зомби и снеси босса в конце улицы.">
<title>Крепость на Колёсах</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #10141b;
    position: fixed; inset: 0;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: none; overscroll-behavior: none;
  }
  #game { display: block; width: 100%; height: 100%; touch-action: none; }
  /* Boot-оверлей: блок с гусеницей и дулом, без текста. */
  #boot {
    position: fixed; inset: 0; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    background: #10141b;
  }
  #bootmark {
    width: 104px; height: 76px; border-radius: 9px;
    background: linear-gradient(160deg, #6b7785 0%, #414a55 55%, #2a3038 100%);
    box-shadow: 0 12px 28px rgba(0,0,0,0.5), inset 0 0 0 3px #f0c14b;
    position: relative;
    animation: bootpulse 1.2s ease-in-out infinite;
  }
  #bootmark::before { /* гусеница */
    content: ''; position: absolute; left: 6px; right: 6px; bottom: -13px;
    height: 11px; border-radius: 4px;
    background: repeating-linear-gradient(90deg, #3a424c 0 7px, #232a32 7px 11px);
    box-shadow: inset 0 0 0 1px #5b6672;
  }
  #bootmark::after { /* дуло */
    content: ''; position: absolute; right: -26px; top: 26px;
    width: 34px; height: 12px; border-radius: 4px;
    background: linear-gradient(180deg, #8a97a8, #4b5561);
    box-shadow: 0 0 0 2px rgba(0,0,0,0.25);
  }
  @keyframes bootpulse {
    0%, 100% { transform: translateY(0) rotate(-1.5deg); }
    50%      { transform: translateY(-4px) rotate(1.5deg); }
  }
</style>
</head>
<body>
<div id="boot"><div id="bootmark"></div></div>
<canvas id="game"></canvas>
<script>
  (function () {
    var p = location.protocol;
    if (p !== 'file:' && p !== 'about:' && p !== 'data:') {
      document.write('<script src="/sdk.js"><\/script>');
    }
  })();
</script>
<script src="sdk-stub.js"></script>

<script src="game/i18n.js"></script>
<script src="game/logic.js"></script>
<script src="game/art.js"></script>
<script src="game/scenes.js"></script>
<script src="game/main.js"></script>
</body>
</html>
