<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Побег Стрелок — головоломка: освобождай стрелки, запускай цепные сбросы и проходи уровни за минимум ходов.">
<title>Побег Стрелок</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #101a2e;
    position: fixed; inset: 0;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: none; overscroll-behavior: none;
  }
  #game { display: block; width: 100%; height: 100%; touch-action: none; }
  /* Boot-оверлей без текста — плитка со стрелкой (бренд-знак без glyphs). */
  #boot {
    position: fixed; inset: 0; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    background: #101a2e;
  }
  #bootmark {
    width: 72px; height: 72px; border-radius: 18px;
    background: linear-gradient(160deg, #63e6be 0%, #4dd4ac 55%, #2f9e7a 100%);
    box-shadow: 0 8px 0 rgba(0,0,0,0.28), inset 0 -8px 14px rgba(0,0,0,0.18);
    position: relative;
    animation: bootpulse 1.1s ease-in-out infinite;
  }
  #bootmark::before {
    content: ''; position: absolute; left: 50%; top: 50%;
    width: 0; height: 0;
    border-left: 17px solid transparent; border-right: 17px solid transparent;
    border-bottom: 30px solid rgba(255,255,255,0.92);
    transform: translate(-50%, -58%);
  }
  @keyframes bootpulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.08, 0.94); }
  }
</style>
</head>
<body>
<div id="boot"><div id="bootmark"></div></div>
<canvas id="game"></canvas>
<script>
  (function () {
    var p = location.protocol;
    if (p !== 'file:' && p !== 'about:' && p !== 'data:') {
      document.write('<script src="/sdk.js"><\/script>');
    }
  })();
</script>
<script src="sdk-stub.js"></script>
<script src="engine/rng.js"></script>
<script src="engine/i18n.js"></script>
<script src="engine/audio.js"></script>
<script src="engine/input.js"></script>
<script src="engine/ui.js"></script>
<script src="engine/fx.js"></script>
<script src="engine/storage.js"></script>
<script src="engine/sdk.js"></script>
<script src="engine/core.js"></script>
<script src="engine/capture.js"></script>
<script src="game/config.js"></script>
<script src="game/i18n.js"></script>
<script src="game/logic.js"></script>
<script src="game/art.js"></script>
<script src="game/scenes.js"></script>
<script src="game/main.js"></script>
</body>
</html>
