<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="«Свет-Плитки» — гаси неоновые огни тёмного города: одно касание переключает крест из пяти плиток, уложись в лимит ходов.">
<title>Свет-Плитки</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #060911;
    position: fixed; inset: 0;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: none; overscroll-behavior: none;
  }
  #game { display: block; width: 100%; height: 100%; touch-action: none; }
  /* Boot-оверлей: одна горящая неоновая плитка, без текста. */
  #boot {
    position: fixed; inset: 0; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    background: #060911;
  }
  #bootmark {
    width: 84px; height: 84px; border-radius: 16px;
    background: linear-gradient(160deg, #d8fbff 0%, #3fe3ff 45%, #0e8fb8 100%);
    box-shadow: 0 0 42px rgba(63,227,255,0.55), 0 0 12px rgba(63,227,255,0.8), inset 0 0 0 3px rgba(255,255,255,0.55);
    position: relative;
    animation: bootpulse 1.3s ease-in-out infinite;
  }
  #bootmark::before {
    content: ''; position: absolute; inset: 30%;
    background: #ffffff; opacity: 0.85;
    transform: rotate(45deg);
    border-radius: 2px;
  }
  #bootmark::after {
    content: ''; position: absolute; left: 50%; top: 100%; width: 44px; height: 40px;
    margin-left: -22px;
    background: linear-gradient(180deg, rgba(63,227,255,0.38), rgba(63,227,255,0));
    filter: blur(6px);
  }
  @keyframes bootpulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50%      { transform: scale(1.06); opacity: 0.86; }
  }
</style>
</head>
<body>
<div id="boot"><div id="bootmark"></div></div>
<canvas id="game"></canvas>
<script>
  (function () {
    var p = location.protocol;
    if (p !== 'file:' && p !== 'about:' && p !== 'data:') {
      document.write('<script src="/sdk.js"><\/script>');
    }
  })();
</script>
<script src="sdk-stub.js"></script>
<script src="engine/rng.js"></script>

<script src="engine/capture.js"></script>

<script src="game/i18n.js"></script>
<script src="game/logic.js"></script>
<script src="game/art.js"></script>
<script src="game/scenes.js"></script>
<script src="game/main.js"></script>
</body>
</html>
