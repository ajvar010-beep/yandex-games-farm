<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Пицца-Поворот — аркада: крутите пиццу и ловите топпинги золотым куском">
<title>Пицца-Поворот</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #fff1e0;
    position: fixed; inset: 0;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: none; overscroll-behavior: none;
  }
  #game { display: block; width: 100%; height: 100%; touch-action: none; }
  /* Boot-оверлей БЕЗ ТЕКСТА: первая строка, которую видит игрок, обязана быть из
     i18n-словаря и совпадать с материалами (5.1.3). Splash — графический
     кусок пиццы (бренд-знак без glyphs). */
  #boot {
    position: fixed; inset: 0; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    background: #fff1e0;
  }
  #bootmark {
    width: 0; height: 0; position: relative;
    border-left: 34px solid transparent;
    border-right: 34px solid transparent;
    border-bottom: 58px solid #e8a54b;
    border-radius: 0 0 30px 30px / 0 0 16px 16px;
    filter: drop-shadow(0 6px 0 rgba(0,0,0,0.2));
    animation: bootpulse 1.1s ease-in-out infinite;
  }
  /* сыр */
  #bootmark::before {
    content: ''; position: absolute; left: -26px; top: 8px;
    width: 0; height: 0;
    border-left: 26px solid transparent;
    border-right: 26px solid transparent;
    border-bottom: 44px solid #ffd873;
  }
  /* пепперони */
  #bootmark::after {
    content: ''; position: absolute; left: -8px; top: 22px;
    width: 16px; height: 16px; border-radius: 50%;
    background: #d64545;
    box-shadow: -14px 10px 0 -2px #d64545, 12px 12px 0 -3px #d64545;
  }
  @keyframes bootpulse {
    0%, 100% { transform: scale(1) rotate(-3deg); }
    50%      { transform: scale(1.08) rotate(3deg); }
  }
</style>
</head>
<body>
<div id="boot"><div id="bootmark"></div></div>
<canvas id="game"></canvas>
<!-- 1.1: SDK подключается официальным <script src="/sdk.js"> на платформе;
     на file:// тег НЕ вставляется (нет 404-ошибки в консоли), работает заглушка. -->
<script>
  (function () {
    var p = location.protocol;
    if (p !== 'file:' && p !== 'about:' && p !== 'data:') {
      document.write('<script src="/sdk.js"><\/script>');
    }
  })();
</script>
<script src="sdk-stub.js"></script>
<script src="engine/rng.js"></script>
<script src="engine/i18n.js"></script>
<script src="engine/audio.js"></script>
<script src="engine/input.js"></script>
<script src="engine/ui.js"></script>
<script src="engine/fx.js"></script>
<script src="engine/storage.js"></script>
<script src="engine/sdk.js"></script>
<script src="engine/core.js"></script>
<script src="engine/capture.js"></script>
<script src="game/config.js"></script>
<script src="game/i18n.js"></script>
<script src="game/art.js"></script>
<script src="game/entities.js"></script>
<script src="game/scenes.js"></script>
<script src="game/main.js"></script>
</body>
</html>
