<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Рыжий Побег — раннер: кот прыгает через препятствия, собирает рыбок">
<title>Рыжий Побег</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #fff4d6;
    position: fixed; inset: 0;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: none; overscroll-behavior: none;
  }
  #game { display: block; width: 100%; height: 100%; touch-action: none; }
  /* Boot-оверлей БЕЗ ТЕКСТА: первая строка, которую видит игрок, обязана быть из
     i18n-словаря и совпадать с материалами (5.1.3). Splash — чисто графическая
     рыжая мордочка кота (бренд-знак без glyphs). */
  #boot {
    position: fixed; inset: 0; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    background: #fff4d6;
  }
  #bootmark {
    width: 66px; height: 60px; border-radius: 48% 48% 44% 44% / 60% 60% 40% 40%;
    background: radial-gradient(circle at 36% 30%, #ffb46b 0%, #ff9436 55%, #e0721f 100%);
    box-shadow: 0 6px 0 rgba(0,0,0,0.2), inset 0 -6px 10px rgba(0,0,0,0.15);
    position: relative;
    animation: bootpulse 1.1s ease-in-out infinite;
  }
  /* уши */
  #bootmark::before, #bootmark::after {
    content: ''; position: absolute; top: -14px;
    width: 0; height: 0;
    border-left: 12px solid transparent;
    border-right: 12px solid transparent;
    border-bottom: 20px solid #ff9436;
  }
  #bootmark::before { left: 6px; transform: rotate(-14deg); }
  #bootmark::after  { right: 6px; transform: rotate(14deg); }
  @keyframes bootpulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.1, 0.94); }
  }
</style>
</head>
<body>
<div id="boot"><div id="bootmark"></div></div>
<canvas id="game"></canvas>
<!-- 1.1: SDK подключается официальным <script src="/sdk.js"> на платформе;
     на file:// тег НЕ вставляется (нет 404-ошибки в консоли), работает заглушка. -->
<script>
  (function () {
    var p = location.protocol;
    if (p !== 'file:' && p !== 'about:' && p !== 'data:') {
      document.write('<script src="/sdk.js"><\/script>');
    }
  })();
</script>
<script src="sdk-stub.js"></script>
<script src="engine/rng.js"></script>
<script src="engine/i18n.js"></script>
<script src="engine/audio.js"></script>
<script src="engine/input.js"></script>
<script src="engine/ui.js"></script>
<script src="engine/fx.js"></script>
<script src="engine/storage.js"></script>
<script src="engine/sdk.js"></script>
<script src="engine/core.js"></script>
<script src="engine/capture.js"></script>
<script src="game/config.js"></script>
<script src="game/i18n.js"></script>
<script src="game/art.js"></script>
<script src="game/entities.js"></script>
<script src="game/scenes.js"></script>
<script src="game/main.js"></script>
</body>
</html>
